[package]
name = "school-record-management"
version = "1.1.2"
description = "학교 기록물 관리 시스템 - Tauri v2 데스크톱 애플리케이션"
authors = ["School Record Management"]
edition = "2021"

[lib]
name = "school_record_management_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
